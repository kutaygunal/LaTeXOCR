[project]
name = "latexocr"
version = "0.1.0"
description = "Convert images of math equations into real LaTeX, with two competing engines and a built-in benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "sympy>=1.12",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# FormulaNet engine (PP-FormulaNet_plus-L) needs PaddleOCR + PaddlePaddle.
# Installed separately because the Paddle wheel is platform-specific:
#   pip install paddlepaddle==3.0.0 paddleocr
# or for CUDA 12.6:
#   pip install paddlepaddle-gpu==3.0.0 -i https://www.paddlepaddle.org.cn/packages/stable/cu126/
formulanet = [
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
